markdown: |-
  ## Overview

  TriggerFlo is a time tracker built into a Kanban board. Every card carries its own estimate, tracked time and due date, so starting work and starting the timer are the same action, and planned against actual time is visible on the card.

  ## Features

  - Kanban boards where each card holds an estimate, tracked time and due date
  - Always-on-top floating timer with four layouts
  - Day and week calendar that cards can be dragged onto to block out time
  - Clients, billable rates, reports and invoices generated from tracked time (PDF and CSV)
  - Native apps for macOS, Windows and Linux (x86_64 and ARM64), iPhone, Android, Apple Watch and Wear OS, plus a web app

  ## Pricing

  - **Free Plan**: free forever, up to 3 projects
  - **Pro**: $5.99 per month or $45.99 per year
  - **Lifetime**: $119 one-time payment, updates included

  ## Use Cases

  - Freelancers who plan, track and invoice their own client work in one app
  - Small teams that want estimates and tracked time on the same board
  - Linux users looking for a native desktop time tracker
