markdown: >-
  ## Overview


  SUNAGO Matrix is software for consulting and engineering firms. Its Timesheet is free for the whole firm, with no limit on the number of users. Employees register time on projects and internal activities, and managers approve the week.


  ## Features


  - **Free Timesheet**: Register time per day or per week, with no user limit

  - **Approval**: Employees submit their week and a manager approves or rejects it

  - **Closed periods**: Close a pay period so approved hours cannot change

  - **Expenses**: Register expenses with photos of receipts

  - **Change history**: See who changed an entry and when

  - **Utilization**: Billable and total utilization for each person and team, based on registered hours

  - **Time suggestions**: Suggestions from Outlook meetings and from the Activity Logger app for Windows

  - **Reminders**: Reminders for employees who have not registered their time


  ## Use Cases


  - Consulting and engineering firms that bill customers by the hour

  - Firms that need manager approval before hours go to payroll or invoicing

  - Firms that want to see billable and not billable time per person and team


  ## Pricing


  Timesheet is free with no user limit. Project management, CRM and HR cost EUR 9.99 per user with access per month. Paid parts have a 7-day free trial.
