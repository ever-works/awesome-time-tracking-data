markdown: |-
  ## Overview

  Screenpipe captures screen text and audio history locally by default, creating searchable context for reviewing work across apps and meetings.

  ## Features

  - Search captured screen text and audio transcripts
  - Recall information seen or heard during work
  - Create meeting notes and work summaries with AI
  - Provide selected work context to AI assistants through a local API and MCP server

  ## Use Cases

  - Reconstruct work activity and prepare daily or weekly summaries
  - Find prior meeting discussions and follow-up context
  - Recall research and information across applications

  ## Privacy and License

  Raw history stays local by default. Configured cloud AI, transcription, sync and integrations may send context off the device. The source code is available under the [Screenpipe Commercial License](https://github.com/screenpipe/screenpipe/blob/main/LICENSE.md), which is not an OSI open-source license.

  ## Pricing

  Free and paid plans; see [current plans and limits](https://screenpipe.com/pricing).

  ## References

  - [Repository](https://github.com/screenpipe/screenpipe)
  - [MCP documentation](https://github.com/screenpipe/screenpipe/tree/main/packages/screenpipe-mcp)
